name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# Pull requests share one group per PR and cancel superseded runs; each push
# to main gets its own group keyed by commit, so main runs never cancel.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Quality gates
        run: bun run ci

  browser:
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # Not cached, as Playwright's CI guide recommends: the OS packages take
      # about 36 s and cannot be cached, while the browsers download in about
      # 8 s, no slower than restoring (and saving) a 387 MB cache.
      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Build package
        run: bun run build

      - name: Browser acceptance (Chromium + WebKit native HLS)
        timeout-minutes: 10
        run: bun run test:browser

      - name: Upload browser failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-acceptance-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
