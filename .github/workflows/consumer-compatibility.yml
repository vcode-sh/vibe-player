name: Consumer compatibility

on:
  workflow_call:

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: "22.0.0"
            arguments: "--react-version 19.2.7 --skip-build"
          - node: "24"
            arguments: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build package with the development toolchain
        run: bun run build

      - name: Setup consumer Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Verify isolated consumer
        run: node scripts/assert-packed-consumer.mjs ${{ matrix.arguments }}
