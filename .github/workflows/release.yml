name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Release quality gates
        run: bun run ci

      - name: Setup minimum consumer Node
        uses: actions/setup-node@v6
        with:
          node-version: "22.0.0"
          package-manager-cache: false

      - name: Verify minimum Node and React
        run: node scripts/assert-packed-consumer.mjs --react-version 19.2.7 --skip-build

      - name: Restore publishing Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish committed version to npm
        run: bun run release:publish --no-git-tag
