name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Prepare release notes from CHANGELOG
        id: release
        run: node scripts/write-release-notes.mjs --output "$RUNNER_TEMP/release-notes.md"

      - name: Refuse an existing release tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
          if [ "$status" -eq 0 ]; then
            echo "::error::Tag $TAG already exists on origin. Bump the version before releasing."
            exit 1
          fi
          if [ "$status" -ne 2 ]; then
            echo "::error::Could not check origin for tag $TAG (git exit code $status)."
            exit 1
          fi

      - name: Release quality gates
        run: bun run ci

      - name: Install browser engines
        run: bunx playwright install --with-deps chromium webkit

      - name: Browser acceptance (Chromium + WebKit native HLS)
        timeout-minutes: 5
        run: bun run test:browser

      - name: Upload browser failure evidence
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-acceptance-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Setup minimum consumer Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22.0.0"
          package-manager-cache: false

      - name: Verify minimum Node and React
        run: node scripts/assert-packed-consumer.mjs --react-version 19.2.7 --skip-build

      - name: Restore publishing Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish committed version to npm
        run: bun run release:publish --no-git-tag

      - name: Tag the released commit
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md" "${flags[@]}"
