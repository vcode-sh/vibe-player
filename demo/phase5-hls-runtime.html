<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Vibe Player Phase 5 HLS Runtime QA</title>
    <link href="/src/styles/vibe-player.css" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "hls.js": "https://esm.sh/hls.js@1.7.3",
        "react": "https://esm.sh/react@19.3.1",
        "react-dom/client": "https://esm.sh/react-dom@19.3.1/client",
        "react/jsx-runtime": "https://esm.sh/react@19.3.1/jsx-runtime"
      }
    }
    </script>
    <style>
    :root {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #f8fafc;
      background: #111111;
    }

    .qa-page {
      box-sizing: border-box;
      display: grid;
      gap: 18px;
      max-width: 1120px;
      min-height: 100vh;
      padding: 28px 18px;
      margin: 0 auto;
    }

    .qa-title {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .qa-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 18px;
    }

    .qa-events {
      min-height: 120px;
      padding: 14px;
      background: rgb(255 255 255 / 8%);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 8px;
    }

    .qa-events h2 {
      margin: 0 0 10px;
      font-size: 13px;
    }

    .qa-events ol {
      display: grid;
      gap: 8px;
      padding-left: 18px;
      margin: 0;
      font-size: 12px;
    }

    @media (max-width: 760px) {
      .qa-grid {
        grid-template-columns: 1fr;
      }
    }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { VibePlayerInline } from "/dist/index.js";

    const { createElement } = React;
    const source = {
      id: "phase5-hls-vod",
      manifestUrl: "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8",
      posterUrl:
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'%3E%3Crect width='1280' height='720' fill='%23111111'/%3E%3Crect x='120' y='140' width='1040' height='440' rx='22' fill='%232f3b52'/%3E%3Ccircle cx='520' cy='360' r='115' fill='%238fbddf'/%3E%3Cpath d='M610 292l150 68-150 68z' fill='%23f8fafc'/%3E%3C/svg%3E",
      title: "HLS VOD stream",
      type: "hls",
    };

    function App() {
      const [events, setEvents] = React.useState([]);
      const onAnalyticsEvent = React.useCallback((event) => {
        setEvents((currentEvents) => [event, ...currentEvents].slice(0, 8));
      }, []);

      return createElement(
        "section",
        { className: "qa-page" },
        createElement("h1", { className: "qa-title" }, "Vibe Player HLS QA"),
        createElement(
          "div",
          { className: "qa-grid" },
          createElement(VibePlayerInline, {
            onAnalyticsEvent,
            source,
            title: "Inline HLS player",
          }),
          createElement(
            "aside",
            { className: "qa-events" },
            createElement("h2", null, "Analytics events"),
            createElement(
              "ol",
              null,
              ...events.map((event) =>
                createElement(
                  "li",
                  { key: `${event.type}-${event.currentTime ?? 0}` },
                  `${event.type} / ${Math.round(event.currentTime ?? 0)}s`
                )
              )
            )
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(createElement(App));
    </script>
  </body>
</html>
