<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1" name="viewport">
    <title>Vibe Player Phase 7 Ambient Preview Runtime QA</title>
    <link href="/src/styles/vibe-player.css" rel="stylesheet">
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.3.1",
        "react-dom/client": "https://esm.sh/react-dom@19.3.1/client",
        "react/jsx-runtime": "https://esm.sh/react@19.3.1/jsx-runtime"
      }
    }
    </script>
    <style>
    :root {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #f8fafc;
      background: #111111;
    }

    .qa-page {
      box-sizing: border-box;
      display: grid;
      gap: 18px;
      max-width: 1120px;
      min-height: 100vh;
      padding: 28px 18px;
      margin: 0 auto;
    }

    .qa-title {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .qa-preview-copy {
      align-self: end;
      max-width: 34rem;
    }

    .qa-preview-copy h2 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4vw, 44px);
      line-height: 1;
    }

    .qa-preview-copy p {
      margin: 0;
      font-size: 14px;
      line-height: 1.5;
      color: rgb(255 255 255 / 76%);
    }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { VibePlayerAmbientPreview, VibePlayerModal } from "/dist/index.js";

    const { createElement } = React;
    const mediaUrl =
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
    const posterUrl =
      "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'%3E%3Crect width='1280' height='720' fill='%23111111'/%3E%3Ccircle cx='410' cy='355' r='210' fill='%238fbddf'/%3E%3Ccircle cx='670' cy='320' r='170' fill='%23f4c16f'/%3E%3Ccircle cx='820' cy='395' r='215' fill='%23f47b6d'/%3E%3Crect y='510' width='1280' height='210' fill='%23222522'/%3E%3C/svg%3E";
    const source = {
      id: "phase7-file-player",
      posterUrl,
      sources: [{ mimeType: "video/mp4", url: mediaUrl }],
      title: "Ambient flower study",
      type: "file",
    };
    const previewSource = {
      id: "phase7-ambient-preview",
      posterUrl,
      previewVideoUrl: mediaUrl,
    };

    function App() {
      const [open, setOpen] = React.useState(false);

      return createElement(
        "section",
        { className: "qa-page" },
        createElement(
          "h1",
          { className: "qa-title" },
          "Vibe Player Ambient Preview QA"
        ),
        createElement(
          VibePlayerAmbientPreview,
          {
            activateLabel: "Open ambient preview player",
            onActivate: () => setOpen(true),
            source: previewSource,
            title: "Ambient preview",
          },
          createElement(
            "div",
            { className: "qa-preview-copy" },
            createElement("h2", null, "Ambient preview"),
            createElement(
              "p",
              null,
              "Muted preview loop with poster fallback and modal handoff."
            )
          )
        ),
        createElement(VibePlayerModal, {
          onClose: () => setOpen(false),
          open,
          source,
          title: "Ambient preview handoff",
        })
      );
    }

    createRoot(document.getElementById("root")).render(createElement(App));
    </script>
  </body>
</html>
