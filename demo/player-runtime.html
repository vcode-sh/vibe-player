<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vibe Player Demo</title>
    <link rel="stylesheet" href="/src/styles/vibe-player.css">
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.7",
        "react/jsx-runtime": "https://esm.sh/react@19.2.7/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@19.2.7/client"
      }
    }
    </script>
    <style>
    :root {
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      color-scheme: dark;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: #f8fafc;
      background: #101010;
    }

    button,
    a {
      font: inherit;
    }

    .demo-page {
      box-sizing: border-box;
      display: grid;
      gap: 18px;
      max-width: 1120px;
      min-height: 100vh;
      padding: 28px 18px;
      margin: 0 auto;
    }

    .demo-bar,
    .demo-panel {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
    }

    .demo-title {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
    }

    .demo-button {
      min-height: 40px;
      padding: 0 16px;
      color: #111;
      cursor: pointer;
      background: #f8fafc;
      border: 0;
      border-radius: 8px;
    }

    .demo-frame {
      position: relative;
      min-height: 240px;
    }

    .demo-source-link {
      color: rgba(255, 255, 255, 0.72);
      text-decoration: none;
    }

    .demo-source-link:hover {
      color: #fff;
    }

    .demo-events {
      display: grid;
      gap: 8px;
      padding: 14px;
      margin: 0;
      font-size: 12px;
      background: rgb(255 255 255 / 8%);
      border: 1px solid rgb(255 255 255 / 12%);
      border-radius: 8px;
    }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="module">
    import React from "react";
    import { createRoot } from "react-dom/client";
    import { VibePlayerStage } from "/dist/index.js";

    const createElement = React.createElement;
    const mediaUrl =
      "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
    const source = {
      id: "demo-file-player",
      posterUrl:
        "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'%3E%3Crect width='1280' height='720' fill='%23101010'/%3E%3Ccircle cx='442' cy='338' r='210' fill='%238fbddf'/%3E%3Ccircle cx='690' cy='326' r='158' fill='%23f4c16f'/%3E%3Ccircle cx='830' cy='402' r='205' fill='%23f47b6d'/%3E%3Crect y='522' width='1280' height='198' fill='%23222522'/%3E%3C/svg%3E",
      sources: [{ mimeType: "video/mp4", url: mediaUrl }],
      title: "Package demo player",
      type: "file",
    };

    function App() {
      const [open, setOpen] = React.useState(false);
      const [events, setEvents] = React.useState([]);
      const onAnalyticsEvent = React.useCallback((event) => {
        setEvents((currentEvents) => [event, ...currentEvents].slice(0, 5));
      }, []);
      const topActions = createElement(
        "a",
        {
          className: "demo-source-link",
          href: mediaUrl,
          rel: "noreferrer",
          target: "_blank",
        },
        "Open source"
      );

      return createElement(
        "section",
        { className: "demo-page" },
        createElement(
          "div",
          { className: "demo-bar" },
          createElement("h1", { className: "demo-title" }, "Vibe Player Demo"),
          createElement(
            "button",
            {
              className: "demo-button",
              onClick: () => setOpen((currentOpen) => !currentOpen),
              type: "button",
            },
            open ? "Close player" : "Open player"
          )
        ),
        createElement(
          "div",
          { className: "demo-frame" },
          open
            ? createElement(VibePlayerStage, {
                autoPlay: true,
                onAnalyticsEvent,
                onClose: () => setOpen(false),
                open,
                source,
                title: "Cinematic package demo",
                topActions,
              })
            : createElement(
                "div",
                { className: "demo-panel" },
                "Open the player to verify autoplay and media-click toggle."
              )
        ),
        createElement(
          "ol",
          { className: "demo-events" },
          ...events.map((event) =>
            createElement(
              "li",
              { key: `${event.type}-${event.currentTime ?? 0}` },
              `${event.type} / ${Math.round(event.currentTime ?? 0)}s`
            )
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(createElement(App));
    </script>
  </body>
</html>
