<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Live YouTube package acceptance</title>
  </head>
  <body>
    <main>
      <h1>Live YouTube package acceptance</h1>
      <p>Official public IFrame API sample: M7lc1UVf-VE.</p>
      <section aria-label="YouTube presentation" id="stage">
        <div id="media"></div>
      </section>
      <nav aria-label="Package controls">
        <button id="play" type="button">Play</button>
        <button id="pause" type="button">Pause</button>
        <button id="remount" type="button">Mount same target again</button>
        <label>Playback rate <select id="rate"></select></label>
        <button id="dispose" type="button">Dispose</button>
      </nav>
      <pre id="probe"></pre>
    </main>
    <script src="/main.ts" type="module"></script>
  </body>
</html>
